name: Sync Template Branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create clean template branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or reset template branch from main
          git checkout -B template

          # Remove framework-specific content (keep .gitkeep files)
          find .claude/work/items -name "*.md" ! -name ".gitkeep" -delete 2>/dev/null || true
          find .claude/work/archive -name "*.md" ! -name ".gitkeep" -delete 2>/dev/null || true
          find .claude/artifacts -name "*.md" -delete 2>/dev/null || true
          find .claude/artifacts -name "*.json" -delete 2>/dev/null || true
          find .claude/artifacts/reviews -type f ! -name ".gitkeep" -delete 2>/dev/null || true
          find .claude/memory -name "*.md" ! -name ".gitkeep" -delete 2>/dev/null || true
          find .claude/patterns/sessions -name "*.jsonl" -delete 2>/dev/null || true
          find .claude/patterns/insights -name "*.md" ! -name ".gitkeep" -delete 2>/dev/null || true
          find .claude/temp -not -name ".gitkeep" -not -path ".claude/temp" -delete 2>/dev/null || true

          # Stage removals and commit (if anything changed)
          git add -A
          if git diff --cached --quiet; then
            echo "Template branch already clean — nothing to commit"
          else
            git commit -m "chore: sync template branch from main (clean slate)"
          fi

          # Force push template branch
          git push origin template --force
